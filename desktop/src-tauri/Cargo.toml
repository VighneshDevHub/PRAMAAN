[package]
name = "pramaan-desktop"
version = "0.1.0"
description = "PRAMAAN — Digital Forensics & Evidence Integrity Platform"
authors = ["PRAMAAN Team"]
edition = "2021"

[lib]
name = "pramaan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pramaan-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
